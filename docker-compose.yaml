networks:
  techkepper:

services:
  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-techkepper_command_center}
      DB_DIALECT: mysql
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-techkepper-command-center}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-techkepper-web}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      BACKEND_URL: ${BACKEND_URL:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PROXY_PORT: ${PROXY_PORT:-${BACKEND_PORT:-8080}}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-cloudapi}
      META_WHATSAPP_ACCESS_TOKEN: ${META_WHATSAPP_ACCESS_TOKEN}
      META_WHATSAPP_PHONE_NUMBER_ID: ${META_WHATSAPP_PHONE_NUMBER_ID}
      META_WHATSAPP_GRAPH_API_VERSION: ${META_WHATSAPP_GRAPH_API_VERSION}
      META_WHATSAPP_VERIFY_TOKEN: ${META_WHATSAPP_VERIFY_TOKEN}
      META_WHATSAPP_APP_SECRET: ${META_WHATSAPP_APP_SECRET}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Administrador Techkepper}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      COMPANY_NAME: ${COMPANY_NAME:-Techkepper}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-ventas@techkeppercr.com}
      COMPANY_PHONE: ${COMPANY_PHONE:-+506 72259973}
      DEFAULT_THEME: ${DEFAULT_THEME:-dark}
      ENABLE_ASSIGNMENT_AUTO_MESSAGE: ${ENABLE_ASSIGNMENT_AUTO_MESSAGE:-true}
      DROPBOX_STORAGE_ENABLED: ${DROPBOX_STORAGE_ENABLED:-false}
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:-}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:-}
      DROPBOX_REDIRECT_URI: ${DROPBOX_REDIRECT_URI:-http://localhost:8081/dropbox/oauth/callback}
      DROPBOX_STORAGE_MODE: ${DROPBOX_STORAGE_MODE:-}
      DROPBOX_REFRESH_TOKEN: ${DROPBOX_REFRESH_TOKEN:-}
      DROPBOX_SYNC_RETRY_INTERVAL_MINUTES: ${DROPBOX_SYNC_RETRY_INTERVAL_MINUTES:-5}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${BACKEND_PORT:-8080}:3000"
    volumes:
      - ./backend/public/:/usr/src/app/public/
      - ./backend/storage/:/usr/src/app/storage/
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - techkepper

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    environment:
      URL_BACKEND: backend:3000
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
      FRONTEND_SERVER_NAME: ${FRONTEND_SERVER_NAME:-localhost}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
      - "${FRONTEND_SSL_PORT:-3001}:443"
    volumes:
      - ./ssl/certs/:/etc/nginx/ssl/
      - ./ssl/www/:/var/www/letsencrypt/
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - techkepper

  mysql:
    image: "${MYSQL_ENGINE:-mariadb}:${MYSQL_VERSION:-10.11}"
    # lower-case-table-names=1 es obligatorio en filesystems case-insensitive
    # (macOS/APFS). Sin esto, InnoDB crea .ibd en minúscula mientras los .frm
    # quedan en CamelCase y el motor falla con "Incorrect information in file".
    # Este valor se fija al inicializar el data dir; cambiarlo requiere
    # reinicializar ./.docker/data.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin --lower-case-table-names=1
    volumes:
      - ./.docker/data/:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-techkepper_command_center}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-America/Costa_Rica}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    restart: unless-stopped
    networks:
      - techkepper
