name: Deploy to Heroku

on:
  workflow_dispatch:

  push:
    branches:
      - dev
      - feat/heroku-deploy

concurrency:
  group: deploy-heroku-${{ github.ref }}
  cancel-in-progress: false

env:
  HEROKU_BACKEND_APP: api-command-center-6a6bbf5602c2
  HEROKU_FRONTEND_APP: web-command-center-e0b9cd1e60e4

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/feat/heroku-deploy'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate secrets
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "Falta el secret HEROKU_API_KEY en GitHub Actions." >&2
            exit 1
          fi
          if [ -z "$ENV_PRODUCTION" ]; then
            echo "Falta el secret ENV_PRODUCTION con el contenido de .env.production." >&2
            exit 1
          fi

      - name: Prepare production env file
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: printf '%s\n' "$ENV_PRODUCTION" > .env.production

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Sync backend config vars
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_FRONTEND_APP: ${{ env.HEROKU_FRONTEND_APP }}
        run: |
          chmod +x scripts/heroku-sync-env.sh
          ./scripts/heroku-sync-env.sh "$HEROKU_BACKEND_APP" .env.production

      - name: Sync frontend config vars
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_FRONTEND_APP: ${{ env.HEROKU_FRONTEND_APP }}
        run: ./scripts/heroku-sync-env.sh "$HEROKU_FRONTEND_APP" .env.production

      - name: Deploy backend
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          git config user.email "github-actions@local"
          git config user.name "GitHub Actions"
          git subtree split --prefix=backend -b heroku-backend-deploy
          git push "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_BACKEND_APP}.git" heroku-backend-deploy:main --force

      - name: Deploy frontend
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          git subtree split --prefix=frontend -b heroku-frontend-deploy
          git push "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_FRONTEND_APP}.git" heroku-frontend-deploy:main --force

      - name: Deploy summary
        run: |
          echo "## Deploy completado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Rama:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Backend:** https://${{ env.HEROKU_BACKEND_APP }}.herokuapp.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Frontend:** https://${{ env.HEROKU_FRONTEND_APP }}.herokuapp.com" >> "$GITHUB_STEP_SUMMARY"
