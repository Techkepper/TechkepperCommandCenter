name: Deploy Backend Heroku

on:
  workflow_dispatch:

  push:
    branches:
      - dev
      - feat/heroku-deploy

concurrency:
  group: deploy-heroku-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/feat/heroku-deploy'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Heroku backend app name
        run: |
          backend_app="${{ vars.HEROKU_BACKEND_APP }}"
          if [ -z "$backend_app" ]; then
            backend_app="api-command-center"
          fi
          echo "HEROKU_BACKEND_APP=$backend_app" >> "$GITHUB_ENV"
          echo "Backend app (CLI): $backend_app"

      - name: Validate secrets
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "Falta el secret HEROKU_API_KEY en GitHub Actions." >&2
            exit 1
          fi
          if [ -z "$ENV_PRODUCTION" ]; then
            echo "Falta el secret ENV_PRODUCTION con el contenido de .env.production." >&2
            exit 1
          fi

      - name: Prepare production env file
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          printf '%s\n' "$ENV_PRODUCTION" > .env.production
          echo "URLs en ENV_PRODUCTION (runtime):"
          grep -E '^(PUBLIC_BACKEND_URL|FRONTEND_URL|VITE_BACKEND_URL|CORS_ALLOWED_ORIGINS)=' .env.production || true

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Verify Heroku backend app
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          chmod +x scripts/heroku-preflight.sh
          ./scripts/heroku-preflight.sh "$HEROKU_BACKEND_APP" backend

      - name: Sync backend config vars
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_FRONTEND_APP: ${{ vars.HEROKU_FRONTEND_APP || 'web-command-center' }}
        run: |
          chmod +x scripts/heroku-sync-env.sh
          ./scripts/heroku-sync-env.sh "$HEROKU_BACKEND_APP" .env.production

      - name: Deploy backend
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          git config user.email "github-actions@local"
          git config user.name "GitHub Actions"
          git subtree split --prefix=backend -b heroku-backend-deploy
          git push "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_BACKEND_APP}.git" heroku-backend-deploy:main --force

      - name: Deploy summary
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          web_url="$(heroku apps:info --app "$HEROKU_BACKEND_APP" | awk -F': ' '/^Web URL/ {print $2}')"
          public_url="$(grep '^PUBLIC_BACKEND_URL=' .env.production | cut -d= -f2- || true)"
          echo "## Deploy backend completado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Rama:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **App Heroku (CLI):** \`${{ env.HEROKU_BACKEND_APP }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Web URL Heroku:** ${web_url:-https://${HEROKU_BACKEND_APP}.herokuapp.com/}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **PUBLIC_BACKEND_URL (env):** ${public_url:-no definida}" >> "$GITHUB_STEP_SUMMARY"
