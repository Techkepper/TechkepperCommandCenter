# X-Frame-Options is to prevent from clickJacking attack
add_header X-Frame-Options DENY always;

# disable content-type sniffing on some browsers.
add_header X-Content-Type-Options nosniff always;

# This header enables the Cross-site scripting (XSS) filter
add_header X-XSS-Protection "0" always;

# This will enforce HTTP browsing into HTTPS and avoid ssl stripping attack
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; media-src 'self' blob: http: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

# Enables response header of "Vary: Accept-Encoding"
gzip_vary on;
